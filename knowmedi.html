<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KnowMedi — Michael Joongmin Park</title>
<link rel="icon" type="image/svg+xml" href="./mkpk.svg" />
<style>
  :root{
    --bg:#ffffff; --ink:#0a0a0a; --muted:#8a8a8a; --line:#e6e6e6;
    --max:1320px; --pad:clamp(20px,4vw,56px);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--bg); color:var(--ink); }
  body{
    font-family:var(--font); font-size:14px; line-height:1.5; font-weight:400;
    letter-spacing:-0.05em; -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility; overflow-x:hidden;
  }
  a{ color:inherit; text-decoration:none; }
  img{ display:block; max-width:100%; }
  ::selection{ background:var(--ink); color:var(--bg); }
  .wrap{ max-width:var(--max); margin:0 auto; padding-left:var(--pad); padding-right:var(--pad); }

  nav.top{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px var(--pad); max-width:var(--max); margin:0 auto; font-size:13px;
  }
  .nav-mark{ font-weight:500; }
  .nav-links{ display:flex; gap:28px; }
  .nav-links a{ color:var(--muted); transition:color .2s; }
  .nav-links a:hover{ color:var(--ink); }

  header.hero{
    padding:64px var(--pad) 64px;
    border-bottom:1px solid var(--line);
  }
  .hero-back{ font-size:13px; color:var(--muted); margin-bottom:32px; }
  .hero-back a:hover{ color:var(--ink); }
  .hero-greeting{ font-size:17px; color:var(--muted); margin-bottom:6px; }
  .hero-name{
    font-weight:500; font-size:clamp(28px,4.5vw,64px);
    line-height:1.05; letter-spacing:-0.05em;
  }
  .hero-tagline{ font-size:16px; color:var(--muted); margin-top:14px; line-height:1.5; }
  .hero-row{ margin-top:36px; padding-top:24px; border-top:1px solid var(--line); }
  .hero-side{
    display:flex; flex-direction:row; justify-content:space-between;
    flex-wrap:wrap; font-size:13px; gap:16px;
  }
  .hero-side .pair{ display:flex; flex-direction:column; gap:2px; }
  .hero-side dt{ color:var(--muted); }
  .view-link{ border-bottom:1px solid var(--ink); transition:opacity .2s; }
  .view-link:hover{ opacity:0.6; }
  .status-live{ display:inline-flex; align-items:center; gap:7px; }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:#22c55e; flex-shrink:0; }

  .kpi-section{ padding-bottom:64px; }
  .kpi-row{
    display:grid; grid-template-columns:1fr 1fr 1fr;
    border-bottom:1px solid var(--line);
    padding:32px 0;
  }
  .kpi{ display:flex; flex-direction:column; gap:6px; padding:0 40px; }
  .kpi:first-child{ padding-left:0; }
  .kpi:last-child{ padding-right:0; }
  .kpi + .kpi{ border-left:1px solid var(--line); }
  .kpi-num{
    font-size:clamp(28px,3.5vw,48px); font-weight:500;
    letter-spacing:-0.05em; line-height:1;
  }
  .kpi-label{ font-size:13px; color:var(--muted); }

  @media(max-width:880px){
    .hero-name{ font-size:clamp(24px,7vw,48px); }
    .kpi-row{ padding:24px 0; }
    .kpi{ padding:0 20px; }
  }
  @media(max-width:640px){
    .kpi-row{ grid-template-columns:1fr; padding:0; }
    .kpi{ padding:20px 0; }
    .kpi + .kpi{ border-left:none; border-top:1px solid var(--line); }
  }

  /* PHASE COLLAPSIBLE */
  .phase-media-wrap{ max-width:var(--max); margin:0 auto; padding:clamp(28px,4vw,48px) var(--pad) clamp(40px,6vw,80px); cursor:pointer; }
  .phase-toggle{
    display:block; width:100%; border:none; cursor:pointer;
    font-family:var(--font); color:var(--ink);
    padding:2px 0 clamp(20px,3vw,32px);
    position:sticky; top:calc(var(--nav-h,57px) - 2px); z-index:40;
    background:var(--bg);
    background:color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .phase-toggle-inner{
    display:flex; align-items:center; justify-content:space-between;
    gap:24px; max-width:var(--max); margin:0 auto; text-align:left;
    padding-left:var(--pad); padding-right:var(--pad);
  }
  .phase-num{ font-size:11px; color:var(--muted); letter-spacing:0.07em; margin-bottom:4px; }
  .phase-name{
    font-size:clamp(22px,3vw,42px); font-weight:500;
    letter-spacing:-0.04em; line-height:1.1;
    transition:opacity .2s; margin-bottom:4px;
  }
  .phase-sub{ font-size:13px; color:var(--muted); letter-spacing:-0.02em; line-height:1.4; }
  .phase-toggle:hover .phase-name{ opacity:0.6; }
  .phase-arrow{ flex-shrink:0; color:var(--muted); transition:transform 0.38s ease; }
  .phase-block[data-open] .phase-arrow{ transform:rotate(180deg); }
  .phase-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows 0.45s ease; }
  .phase-block[data-open] .phase-body{ grid-template-rows:1fr; }
  .phase-body-inner{ overflow:hidden; }
  .phase-media{
    width:100%; height:0; padding-top:56.25%;   /* 16:9 viewport */
    border-radius:16px; overflow:hidden;
    background:#e8e8e6; position:relative;
    transition:padding-top .45s ease;
  }
  /* Expanded: viewport height halves (center-cropped); inner content keeps its size */
  .phase-block[data-open] .phase-media{ padding-top:28.125%; }
  .phase-media > *{
    position:absolute; top:50%; left:0;
    width:100%; height:auto !important; aspect-ratio:16/9;
    transform:translateY(-50%);
  }
</style>
<style>
/* ===== iOS design language (SF Pro Display + antialiasing + accent) ===== */
:root{ --accent:#007aff; }
html{ -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
::selection{ background:#007aff; color:#ffffff; }
</style>
<script>/* Mark touch devices before first paint and drop the live blur behind the
   sticky bars: phones recompute it on every scrolled frame. */
try{if(matchMedia("(hover:none) and (pointer:coarse)").matches){
  document.documentElement.className+=" touch-ui";
  var s=document.createElement("style");
  s.textContent="html.touch-ui nav.top,html.touch-ui .phase-toggle{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:var(--bg)!important}";
  document.head.appendChild(s);
}}catch(e){}</script>
</head>
<body>

<nav class="top">
  <div class="nav-inner">
    <a href="./index.html" class="nav-mark">Michael J. Park</a>
    <div class="nav-links">
      <a href="./index.html#work">Work</a>
      <a href="./index.html#about">About</a>
      <a href="./index.html#contact">Contact</a>
      <a href="./Resume%202026%20-%20Joongmin%20Park%20(Michael%20Park).pdf" target="_blank" rel="noopener">Résumé</a>
    </div>

</nav>

<header class="hero wrap">
  <div class="hero-back"><a href="./index.html">← Back to Work</a></div>
  <div class="hero-greeting">Product Design</div>

  <p class="hero-tagline">Patient-Centric Service</p>
  <div class="hero-row">
    <dl class="hero-side">
      <div class="pair"><dt>Year</dt><dd>2026 / Jan</dd></div>

      <div class="pair"><dt>Status</dt><dd class="status-live"><span class="status-dot"></span>Online · Published via GitHub</dd></div>

<div class="phase-wrap">

  <div class="phase-block" data-open>
    <button class="phase-toggle" onclick="togglePhase(this)">
      <div class="phase-toggle-inner">
        <div>
          <div class="phase-num">01</div>
          <div class="phase-name">Overview</div>
          <div class="phase-sub">Patient-centric healthcare service</div>
        </div>
        <svg class="phase-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M5 9L12 16L19 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </button>
    <div class="phase-media-wrap" onclick="togglePhase(this)">
      <div class="phase-media">
        <video class="lazy-vid" data-src="./knowmediprev.mp4" data-poster="./posters/knowmediprev.jpg" loop muted playsinline webkit-playsinline preload="none"
          style="width:100%;height:100%;object-fit:cover;display:block;"></video>
      </div>
    </div>
    <div class="phase-body">
      <div class="phase-body-inner">
        <section class="kpi-section wrap">
          <div class="kpi-row">
            <div class="kpi">
              <div class="kpi-num">—</div>
              <div class="kpi-label">—</div>
            </div>
            <div class="kpi">
              <div class="kpi-num">—</div>
              <div class="kpi-label">—</div>
            </div>
            <div class="kpi">
              <div class="kpi-num">—</div>
              <div class="kpi-label">—</div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

</div><!-- /phase-wrap -->

<div class="phase-wrap">
<div class="phase-block">
  <button class="phase-toggle" onclick="togglePhase(this)">
    <div class="phase-toggle-inner">
      <div>
        <div class="phase-num">02</div>
        <div class="phase-name">Conclusion</div>
        <div class="phase-sub">Reflections and key takeaways</div>
      </div>
      <svg class="phase-arrow" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M5 9L12 16L19 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </button>
  <div class="phase-media-wrap" onclick="togglePhase(this)">
    <div class="phase-media"></div>
  </div>
  <div class="phase-body">
    <div class="phase-body-inner"></div>
  </div>
</div>
</div><!-- /phase-wrap -->

<footer style="padding:clamp(64px,8vw,120px) var(--pad) clamp(48px,6vw,80px); text-align:center;">
  <p style="font-size:13px; color:var(--muted);">© 2026 Michael Joongmin Park</p>
</footer>

<script>
function togglePhase(el) {
  const block = el.closest('.phase-block');
  if (block.hasAttribute('data-open')) {
    const nav = document.querySelector('nav.top');
    const navH = nav ? nav.offsetHeight : 57;
    const blockTop = block.getBoundingClientRect().top + window.scrollY;
    if (window.scrollY > blockTop) {
      window.scrollTo({ top: blockTop - navH, behavior: 'instant' });
    }
    block.removeAttribute('data-open');
  } else {
    block.setAttribute('data-open', '');
  }
}
(function(){const n=document.querySelector('nav.top');if(n)document.documentElement.style.setProperty('--nav-h',n.offsetHeight+'px');})();
</script>
