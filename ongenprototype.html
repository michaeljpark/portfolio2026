<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnGen Radio</title>
<meta name="theme-color" content="#0A0A0A">
<script>
  /* OnGen pages open dark; a light choice made with the header switch is remembered. */
  (function () {
    var t = null;
    try { t = localStorage.getItem('ongen-theme'); } catch (e) {}
    var light = t === 'light';
    document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    if (light) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F4F4F1');
  })();
</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Hanken+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  /* A radio as an app: light body, black screen, flat keys. Red marks what is live. */
  --body:#141414;
  --key:#232323;
  --key-down:#2E2E2E;
  --dimple:#E9E9E6;
  --seam:#1C1C1C;
  --screen:#0D0D0D;
  --ink:#FFFFFF;
  --grey:#8B8B88;
  --red:#E8322B;
  --font:"Geist",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0A0A0A;font-family:var(--font);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg{display:block}

.fit{position:relative;width:390px;height:844px;flex-shrink:0}
.frame{position:absolute;left:0;top:0;transform-origin:0 0;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--body);box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:14px}
@media (max-width:500px){
  body{display:block}
  .fit{width:100%!important;height:100%!important}
  .frame{position:relative;width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important}
}

/* ---------- Screen ---------- */
.screen{position:relative;flex:0 0 292px;min-height:0;border-radius:32px;background:#0B0B0B;box-shadow:0 0 0 1px rgba(255,255,255,.04);overflow:hidden;color:var(--ink)}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .45s ease,transform .55s var(--ease)}
.layer[aria-hidden="true"]{opacity:0;pointer-events:none}
#layerHome[aria-hidden="true"]{transform:scale(.97)}
#layerPlayer[aria-hidden="true"]{transform:translateY(16px)}

.status-float{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none}
.status-float .sbtn{pointer-events:auto}
.status{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 22px}
.mark{height:15px;width:auto;color:#6E6E6B;display:block}
.status-l{display:flex;align-items:center;gap:16px;min-width:0}
.status-l .lbl{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{width:6px;height:6px;border-radius:50%;background:#555;flex-shrink:0}
.led.live{background:var(--red)}
.led.blink{background:var(--red);animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.status-r{display:flex;align-items:center}
.sbtn{width:40px;height:40px;display:grid;place-items:center;color:#DADAD7}
.sbtn.dim{color:#4A4A48}
.sbtn[hidden]{display:none}
.back{display:flex;align-items:center;gap:4px;height:40px;margin-left:-8px;padding:0 6px 0 2px;color:#DADAD7;font-size:12px;letter-spacing:.04em}

.hero{position:relative;flex:1;min-height:0;cursor:grab;touch-action:none}
.hs{position:absolute;left:22px;bottom:18px;height:16px;font-size:12px;color:#7A7A77;display:flex;align-items:center;gap:7px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.planet img{position:absolute;left:50%;top:50%;height:100%;width:auto;transform:translate(-50%,-50%)}
.planet canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .8s ease}
.planet canvas.ready{opacity:1}
.planet:has(canvas.ready) img{display:none}

.band{position:relative;height:88px;flex-shrink:0}
.band canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.big{flex-shrink:0;padding:0 22px 22px;font-variant-numeric:tabular-nums;color:#F2F2EF}
.big .n{font-size:64px;font-weight:300;letter-spacing:-.035em;line-height:.9}
.big .n small{font-size:15px;font-weight:400;letter-spacing:0;color:#6E6E6B;margin-left:8px}
.big .s{height:18px;font-size:12px;color:#7A7A77;display:flex;align-items:center;gap:7px;margin-bottom:10px}

.lyrics{flex:1;min-height:0;overflow:hidden;position:relative;padding:0 20px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 16%,#000 80%,transparent 100%)}
.col{transition:transform .75s cubic-bezier(.22,.8,.2,1);will-change:transform}
.ln{padding:7px 0;transform-origin:0 50%;transform:scale(.84);color:#4B4B49;transition:transform .75s cubic-bezier(.22,.8,.2,1),color .5s,opacity .5s}
.ln.far{opacity:.4}
.ln.active{transform:scale(1);color:#fff;opacity:1}
.ln .tag{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7C7C79;margin-bottom:6px}
.ln p{margin:0;font-size:25px;line-height:1.16;font-weight:400;letter-spacing:-.025em;text-wrap:pretty}
.ln .w{transition:color .22s}
.ln.active .w{color:#555553}
.ln.active .w.on{color:#fff}

/* ---------- Body strip ---------- */
.strip{height:40px;flex-shrink:0;display:flex;align-items:center;gap:14px}
.pill{height:40px;padding:0 14px;border-radius:10px;background:var(--seam);color:#fff;display:flex;align-items:center;gap:10px;flex-shrink:0}
.pill svg{height:13px;width:auto}
.pill span{font-size:12px;color:#A3A3A0;letter-spacing:.02em}
.grille{flex:1;height:30px;background:radial-gradient(circle,#A2A29F 1.15px,transparent 1.5px) 0 0/6px 6px}

/* ---------- Radio mode dial ---------- */
.modes{flex:0 0 48px;max-height:48px;position:relative;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.modes:active{cursor:grabbing}
.modes canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- Keys ---------- */
.key.kcard{display:flex;justify-items:stretch;align-items:center;gap:14px;padding:0 18px;border-radius:32px}
.key.kcard:active{background:var(--key)}
.kc-art{flex:0 0 52px;height:52px;border-radius:14px;background:#1A1A1A;display:grid;place-items:center;color:#F0F0ED}
.kc-art{position:relative}
.kc-logo{width:34px;height:auto;display:block;transition:opacity .25s ease,transform .25s ease}
.kc-spin{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:2px solid rgba(240,240,237,.14);border-top-color:#F0F0ED;opacity:0;transform:scale(.6);transition:opacity .25s ease,transform .25s ease}
.kc-art.loading .kc-logo{opacity:0;transform:scale(.6)}
.kc-art.loading .kc-spin{opacity:1;transform:scale(1);animation:kcspin .8s linear infinite}
@keyframes kcspin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.kc-name.swap{animation:kcswap .3s ease}
@keyframes kcswap{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.kc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}
.kc-kind{font-size:12px;color:#7A7A77;letter-spacing:.01em}
.kc-name{font-size:16px;font-weight:400;color:#F0F0ED;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-play{flex:0 0 52px;height:52px;border-radius:14px;background:#E8322B;color:var(--key);display:grid;place-items:center;box-shadow:0 0 18px rgba(232,50,43,.55),0 0 42px rgba(232,50,43,.22);transition:transform .12s ease,filter .12s ease}
.kc-play svg{width:26px;height:26px;display:block}
.kc-play:active{transform:scale(.94);filter:brightness(.9)}
.kc-play.busy{animation:kcpulse 1s ease-in-out infinite}
@keyframes kcpulse{50%{opacity:.6;box-shadow:0 0 8px rgba(232,50,43,.3)}}
.keys{flex:0 0 88px;display:grid;grid-template-columns:1fr;gap:8px}
.key{position:relative;background:var(--key);border-radius:32px;display:grid;place-items:center;transition:background .12s;color:#F0F0ED}
.key.small{color:#6A6A67}
.key.small.on{color:#F0F0ED}
.key:active{background:var(--key-down)}

.dimple{border-radius:50%;background:var(--dimple);box-shadow:inset 0 0 0 1px #CACAC7;display:grid;place-items:center}
.tall .dimple{width:84px;height:84px}
.small .dimple{width:42px;height:42px;color:#7A7A77}
.key .cap{position:absolute;left:12px;bottom:10px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8E8E8B}
.key .k-led{position:absolute;right:12px;top:12px;width:6px;height:6px;border-radius:50%;box-shadow:inset 0 0 0 1.2px #9A9A97}
.key .k-led.on{background:var(--seam);box-shadow:none}
.sync{height:104px;flex-shrink:0;display:flex;align-items:stretch}
.half{position:relative;flex:1}
.half-rule{width:1px;align-self:center;height:56%;background:#454543}
.src-card{position:relative;background:var(--key);border-radius:32px}
.logos{position:absolute;left:18px;top:18px;display:flex;align-items:center;gap:6px}
.tile{width:44px;height:44px;border-radius:16px;background:#1D1D1D;display:grid;place-items:center;transition:background .2s}
.tile:active{background:#171717}
.tile .logo{height:20px;width:auto;max-width:24px;display:block;opacity:.28;filter:grayscale(1);transition:opacity .3s,filter .3s}
.tile.on .logo{opacity:1;filter:none}
.src-cap{position:absolute;left:22px;bottom:18px;font-size:12px;color:#7A7A77}
.src-card .tile{width:34px;height:34px;border-radius:11px}
.src-card .tile .logo{height:16px;max-width:20px}
.src-card .logos{gap:5px}
.spk-meta{display:flex;flex-direction:column;gap:2px;margin-left:6px}
.spk-name{font-size:12px;color:#BDBDBA;white-space:nowrap}
.spk-sn{font-size:10px;color:#6E6E6B;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.src-cap{position:absolute;left:18px;bottom:18px;font-size:11px;color:#7A7A77}
.src-state{position:absolute;right:16px;bottom:18px;font-size:12px;color:#7A7A77;transition:color .3s}
.src-state.on{color:#E6E6E3}
.dialkey{position:relative;background:#0B0B0B;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.dialkey:active{background:#0B0B0B}
.dialkey canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.rec-dot{width:26px;height:26px;border-radius:50%;background:var(--red)}
.busy .rec-dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.7);opacity:.6}}
.key[aria-disabled="true"] .dimple{opacity:.5}
.ic-play{width:0;height:0;border-left:20px solid #1C1C1C;border-top:12.5px solid transparent;border-bottom:12.5px solid transparent;margin-left:6px}
.ic-pause{display:flex;gap:6px}
.ic-pause i{width:6px;height:22px;border-radius:2px;background:#1C1C1C}
.key[aria-disabled="true"] #playIcon{opacity:.25}
#playIcon svg{display:block}

.program{flex-shrink:0;border-radius:32px;background:#0B0B0B;box-shadow:0 0 0 1px rgba(255,255,255,.04);padding:16px 18px 18px;color:#F0F0ED}
.pg-head{display:flex;justify-content:space-between;align-items:center;height:22px}
.pg-head b{font-size:13px;font-weight:500}
.pg-head b span{color:#6E6E6B;font-weight:400;margin-left:6px}
.pg-head b span.pg-name{color:#F0F0ED;font-weight:500;margin-left:0}
.pg-edit{font-size:13px;color:#8B8B88;height:32px;padding:0 2px}
.pg-bar{position:relative;height:46px;margin:10px -3px 0;touch-action:none}
.pg-bar .seg{position:absolute;top:0;bottom:0;border-radius:14px;transition:left .18s var(--ease),width .18s var(--ease),background .3s,box-shadow .3s}
.handle{position:absolute;top:-4px;bottom:-4px;width:22px;transform:translateX(-50%);cursor:ew-resize;display:grid;place-items:center;z-index:2;outline:none}
.handle i{width:3px;height:30px;border-radius:2px;background:#5C5C59;transition:background .15s,height .15s}
.handle:hover i,.handle.active i,.handle:focus-visible i{background:#F0F0ED;height:38px}
.pg-legend{position:relative;height:42px;margin:12px -3px 0}
.lg{position:absolute;top:0;white-space:nowrap}
.lg-name{display:flex;align-items:center;gap:6px;font-size:12px;color:#8B8B88;white-space:nowrap}
.lg-name i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.lg-row{display:flex;align-items:center;gap:6px;margin-top:3px}
.lg b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.lg-x{width:20px;height:20px;border-radius:10px;background:#232323;color:#BDBDBA;display:grid;place-items:center;flex-shrink:0}
.pg-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pg-add[hidden]{display:none}
.chip{height:30px;padding:0 12px;border-radius:15px;background:#1C1C1C;color:#BDBDBA;font-size:12px}
.chip:active{background:#262626}
.nowpanel{position:relative;flex-shrink:0;margin:0 -14px -12px;padding:0 24px 0;border-radius:0 0 42px 42px;background:var(--red);color:#0B0B0B;font-family:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,var(--font);display:flex;flex-direction:column;overflow:hidden;max-height:0;clip-path:inset(10px calc(50% - 62px) calc(100% - 46px) calc(50% - 62px) round 18px);transition:max-height .55s cubic-bezier(.32,.72,0,1),margin .55s cubic-bezier(.32,.72,0,1),padding .55s cubic-bezier(.32,.72,0,1),clip-path .65s cubic-bezier(.32,.72,0,1)}
.frame.is-live .nowpanel{max-height:300px;margin:-14px -14px 0;padding-bottom:16px;clip-path:inset(0 0 0 0 round 0 0 42px 42px)}
.nowpanel > *{opacity:0;transition:opacity .2s ease}
.frame.is-live .nowpanel > *{opacity:1;transition:opacity .35s ease .28s}
.frame.is-live .hs{opacity:0}
.frame.is-live{justify-content:flex-start}
.frame:not(.is-live):not(.sheet-open){padding-top:56px}
.frame{transition:padding .55s cubic-bezier(.32,.72,0,1)}
.modes{margin-top:12px}
.src-card{transition:background .6s ease,box-shadow .6s ease}
.program{position:relative;transition:background .6s ease,box-shadow .6s ease}
.frame{isolation:isolate}
.nowpanel[hidden]{display:flex}
.frame .screen > .layer{transition:opacity .45s ease,transform .55s var(--ease)}
.frame.is-live .keys,.frame.is-live .modes{max-height:0;opacity:0;margin-top:-14px;pointer-events:none}
.frame.is-live .screen{flex-basis:232px}
.np-status{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 12px;font-size:16px;font-weight:600;letter-spacing:-.01em}
.np-icons{color:#0B0B0B}
.np-icons{display:flex;align-items:center;gap:6px}
.np-main{display:flex;flex-direction:column;align-items:stretch;width:100%;text-align:left;padding:10px 0 0;font-family:inherit;color:inherit}
.np-k{font-size:17px;color:rgba(11,11,11,.55);letter-spacing:-.01em}
.np-t{font-size:24px;font-weight:400;letter-spacing:-.03em;color:#0B0B0B}
.np-script{position:relative;height:81px;margin-top:6px;overflow:hidden;flex-shrink:0}
.np-line{position:absolute;left:0;right:0;top:0;font-size:22px;line-height:1.22;font-weight:400;letter-spacing:-.02em;color:#0B0B0B;transition:transform .5s cubic-bezier(.22,.8,.2,1),opacity .4s ease}
.np-line.in{transform:translateY(18px);opacity:0}
.np-line.out{transform:translateY(-22px);opacity:0}
.np-line .w{color:rgba(11,11,11,.32);transition:color .2s}
.np-line .w.on{color:#0B0B0B}
.np-r{font-size:14px;color:rgba(11,11,11,.6);margin-top:3px;font-variant-numeric:tabular-nums}
.np-wave{position:relative;display:block;width:100%;height:52px;margin-top:10px;flex-shrink:0}
.np-wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.np-left{font-size:12px;color:rgba(11,11,11,.55);margin-top:4px;flex-shrink:0}
.np-next{display:flex;flex-direction:column;margin-top:14px;padding:13px 20px 15px;border-radius:26px;background:rgba(0,0,0,.09)}
.np-next .np-k{font-size:15px}
.np-next .np-t{font-size:18px}
.np-next .np-r{font-size:13px}
.sync,.keys,.modes{transition:max-height .55s cubic-bezier(.32,.72,0,1),opacity .3s ease,margin .55s cubic-bezier(.32,.72,0,1);overflow:hidden}
.sync{max-height:104px}.keys{max-height:88px}
.frame.sheet-open .sync,.frame.sheet-open .keys,.frame.sheet-open .modes{max-height:0;opacity:0;margin-top:-14px;pointer-events:none}
.screen{transition:flex-basis .55s cubic-bezier(.32,.72,0,1)}
.frame.sheet-open .screen{flex-basis:554px}
.sbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:25;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 38px;color:#F2F2EF;font-family:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,var(--font);font-size:16px;font-weight:600;letter-spacing:-.01em;pointer-events:none;transition:opacity .3s ease}
.sb-icons{display:flex;align-items:center;gap:6px;color:#F2F2EF}
.frame.is-live .sbar{opacity:0}
@media (max-width:500px){.sbar{display:none}}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:30;width:124px;height:36px;border-radius:18px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:0 18px;overflow:hidden;cursor:default;transition:width .55s cubic-bezier(.3,1.25,.4,1),height .55s cubic-bezier(.3,1.25,.4,1),border-radius .55s cubic-bezier(.3,1.25,.4,1),padding .4s ease}
.island > *{opacity:0;transition:opacity .2s ease}
.island.live{width:calc(100% - 24px);height:40px;border-radius:20px;padding:0 18px 0 20px;cursor:pointer}
.island.live > *{opacity:1;transition:opacity .3s ease .25s}
.isl-txt{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.isl-k{font-size:11px;color:#8B8B88}
.isl-n{font-size:13px;font-weight:500;color:#F2F2EF;overflow:hidden;text-overflow:ellipsis}
.isl-wave{display:flex;align-items:center;gap:3px;height:18px;flex-shrink:0}
.isl-wave i{display:block;width:3px;height:100%;border-radius:2px;background:var(--red);transform-origin:50% 50%;animation:isl 1s ease-in-out infinite}
.isl-wave i:nth-child(1){animation-duration:.9s}
.isl-wave i:nth-child(2){animation-duration:1.15s;animation-delay:-.3s}
.isl-wave i:nth-child(3){animation-duration:.8s;animation-delay:-.5s}
.isl-wave i:nth-child(4){animation-duration:1.05s;animation-delay:-.2s}
.isl-wave i:nth-child(5){animation-duration:.95s;animation-delay:-.65s}
@keyframes isl{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.island:not(.live) .isl-wave i{animation-play-state:paused}
@media (max-width:500px){.island:not(.live){opacity:0;pointer-events:none}}
.toast{position:absolute;left:50%;bottom:250px;transform:translate(-50%,8px);background:#F0F0ED;color:#111;font-size:12px;letter-spacing:.02em;padding:9px 14px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
  .kc-art.loading .kc-spin{animation:kcspin 1.2s linear infinite!important}
}
</style>
<style>
/* ===== Top bar: back to the portfolio and to the OnGen page, plus the light / dark switch.
   The phone keeps its dark finish in both themes; only the page around it changes. ===== */
:root{--chrome:54px;--pm:clamp(16px,3.2vw,48px)}
body{padding-top:var(--chrome)}
.p-chrome{position:fixed;top:0;left:0;right:0;z-index:50;height:var(--chrome);display:flex;align-items:center;gap:12px;padding:0 var(--pm);font-family:var(--font);font-size:13px;color:#F2F2EF;-webkit-font-smoothing:antialiased}
.p-chrome a{color:inherit;text-decoration:none;white-space:nowrap;transition:opacity .2s}
.p-chrome a:hover{opacity:.65}
/* same type and place as the name on the portfolio pages */
.pc-home{font-family:"Hanken Grotesk",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:600;line-height:1.45}
.p-chrome .pc-back{color:#8B8B88}
.pc-sep{flex:none;width:1px;height:14px;background:#5E5E5B}
.pc-theme{flex:none;margin-left:auto;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:#1E1E1E;color:#BDBDBA;transition:color .2s,transform .2s var(--ease)}
.pc-theme:hover{color:#F2F2EF}
.pc-theme:active{transform:scale(.94)}
.pc-theme svg{width:16px;height:16px;transition:transform .5s var(--ease)}
.p-chrome :focus-visible{outline:2px solid currentColor;outline-offset:3px}
html[data-theme="light"]{color-scheme:light}
html[data-theme="light"] body{background:#F4F4F1}
html[data-theme="light"] .frame{box-shadow:0 30px 70px rgba(0,0,0,.18)}
html[data-theme="light"] .p-chrome{color:#141414}
html[data-theme="light"] .p-chrome .pc-back{color:#6E6E6B}
html[data-theme="light"] .pc-sep{background:#8E8E8A}
html[data-theme="light"] .pc-theme{background:#E9E9E5;color:#4A4A47}
html[data-theme="light"] .pc-theme:hover{color:#141414}
html[data-theme="light"] .pc-theme svg{transform:rotate(180deg)}
@media (max-width:760px){
  :root{--chrome:47px;--pm:max(18px,env(safe-area-inset-left),env(safe-area-inset-right))}
  .pc-home{font-size:13px}
}
@media (max-width:500px){
  /* on a phone the app is the whole screen, so the bar takes the phone's own body colour and the switch has nothing to change */
  .p-chrome,html[data-theme="light"] .p-chrome{background:#141414;color:#F2F2EF}
  html[data-theme="light"] .p-chrome .pc-back{color:#8B8B88}
  html[data-theme="light"] .pc-sep{background:#5E5E5B}
  .pc-theme{display:none}
  /* the phone hides its own status bar, and this bar now holds that place, so the empty band above the screen goes */
  .frame:not(.is-live):not(.sheet-open){padding-top:14px}
  /* when the app is taller than the screen, the page scrolls instead of cutting off the top and bottom keys */
  html,body{height:auto}
  body,html[data-theme="light"] body{min-height:100%;background:#141414}
  .fit{height:auto!important;min-height:calc(100vh - var(--chrome));min-height:calc(100svh - var(--chrome))}
  .frame{height:auto;min-height:calc(100vh - var(--chrome));min-height:calc(100svh - var(--chrome))}
}
@media (prefers-reduced-motion:reduce){.pc-theme svg{transition:none}}
</style>

(function(){
  const fit = document.getElementById('fit'), fr = document.getElementById('frame');
  function size(){
    if (window.innerWidth <= 500) { fit.style.width = ''; fit.style.height = ''; fr.style.transform = ''; return; }
    // leave room for the top bar above the phone
    const top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--chrome')) || 0;
    const k = Math.min(1, (window.innerHeight - top - 32) / 844, (window.innerWidth - 32) / 390);
    fit.style.width = (390 * k) + 'px'; fit.style.height = (844 * k) + 'px';
    fr.style.transform = 'scale(' + k + ')';
  }
  size(); window.addEventListener('resize', size);
})();

    const items = program.map((p, i) => {
      const tn = tone(p, i);
      const it = document.createElement('div');
      it.className = 'lg';
      const textV = Math.round(112 + tn.t * 143);
      it.innerHTML = '<span class="lg-name">' + CORNERS[p.id].name + '<i style="background:' + tn.hex + (tn.t > .5 ? ';box-shadow:0 0 6px rgba(255,255,255,.5)' : '') + '"></i></span>'
        + '<span class="lg-row"><b style="color:rgb(' + textV + ',' + textV + ',' + (textV - 3) + ')' + (tn.t > .85 ? ';text-shadow:0 0 10px rgba(255,255,255,.35)' : '') + '">' + p.min + 'm</b></span>';
      if (S.edit && program.length > 2) {
        const x = document.createElement('button');
        x.className = 'lg-x'; x.setAttribute('aria-label', 'Remove ' + CORNERS[p.id].name);
        x.innerHTML = '<svg width="9" height="9" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg>';
        x.addEventListener('click', () => removeCorner(i));
        it.querySelector('.lg-row').appendChild(x);
      }
      legend.appendChild(it);
      return it;
    });
    lgItems = items;
    layoutLegend(items);
    // add list
    const free = Object.keys(CORNERS).filter((k) => !program.some((p) => p.id === k));
    addBox.innerHTML = '';
    addBox.hidden = !S.edit || !free.length || program.length >= 6;
    free.forEach((k) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = '+ ' + CORNERS[k].name;
      b.addEventListener('click', () => addCorner(k));
      addBox.appendChild(b);
    });
    $('pgKind').textContent = programKind();
    $('pgName').textContent = SLOTS[slotIdx].name;
    $('kcKind').textContent = programKind(); $('kcName').textContent = SLOTS[slotIdx].name;
    $('pgEdit').textContent = S.edit ? 'Done' : 'Edit';
    $('pgEdit').setAttribute('aria-pressed', String(S.edit));
  }
  let lgItems = [];
  function layoutLegend(items){
    const W = legend.clientWidth, GAPX = 10, IN = 3;
    if (!W) return;
    const ws = items.map((el) => el.offsetWidth);
    let acc = 0;
    const want = program.map((p) => { const x = acc / TOTAL_MIN * W + IN; acc += p.min; return x; });
    const pos = want.slice();
    for (let i = 1; i < pos.length; i++) pos[i] = Math.max(pos[i], pos[i-1] + ws[i-1] + GAPX);
    const last = pos.length - 1;
    if (pos[last] + ws[last] > W - IN) pos[last] = W - IN - ws[last];
    for (let i = last - 1; i >= 0; i--) pos[i] = Math.min(pos[i], pos[i+1] - GAPX - ws[i]);
    items.forEach((el, i) => { el.style.left = Math.max(IN, pos[i]) + 'px'; });
  }
  function changed(){ if (S.hasEp) S.dirty = true; renderProgram(); render(); }
  function shift(i, dm){
    const a = program[i], b = program[i+1], sum = a.min + b.min;
    const na = Math.max(MIN_SEG, Math.min(sum - MIN_SEG, a.min + dm));
    if (na === a.min) return;
    a.min = na; b.min = sum - na; changed();
    const hs = bar.querySelectorAll('.handle'); if (hs[i]) hs[i].focus();
  }
  function startDrag(e, i){
    e.preventDefault();
    const rect = bar.getBoundingClientRect();
    drag = { i, x0: e.clientX, a0: program[i].min, b0: program[i+1].min, w: rect.width };
    renderProgram();
    const move = (ev) => {
      const dm = Math.round((ev.clientX - drag.x0) / drag.w * TOTAL_MIN);
      const sum = drag.a0 + drag.b0;
      const na = Math.max(MIN_SEG, Math.min(sum - MIN_SEG, drag.a0 + dm));
      if (na !== program[drag.i].min) { program[drag.i].min = na; program[drag.i+1].min = sum - na; changed(); }
    };
    const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); drag = null; renderProgram(); };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }
  function removeCorner(i){
    const gone = program.splice(i, 1)[0];
    program[Math.min(i, program.length - 1)].min += gone.min;
    changed();
  }
  function addCorner(k){
    // take minutes from the longest corner
    let big = 0; program.forEach((p, i) => { if (p.min > program[big].min) big = i; });
    const give = Math.min(5, program[big].min - MIN_SEG);
    if (give < MIN_SEG) { toast('No room left, shorten a corner first'); return; }
    program[big].min -= give;
    program.push({ id: k, min: give });
    changed();
  }

  // ---------- Render ----------
  function render(){
    const t = now();
    const inPlayer = S.view === 'player';
    $('layerHome').setAttribute('aria-hidden', String(inPlayer));
    $('layerPlayer').setAttribute('aria-hidden', String(!inPlayer));
    frame.classList.toggle('sheet-open', inPlayer);
    const live = S.playing && !inPlayer;
    if (S.playing && autoNow) autoArmed = true;
    if (!S.playing && autoNow && autoArmed) { autoNow = false; autoArmed = false; setSlotSilent(upcomingIdx); }
    frame.classList.toggle('is-live', live);
    if ($('pgKind').textContent !== programKind()) $('pgKind').textContent = programKind();
    $('nowPanel').hidden = !live;
    if (live) {
      const sl = SLOTS[slotIdx], hm = (m) => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
      const frac = TOTAL ? Math.min(1, t / TOTAL) : 0;

      requestAnimationFrame(() => drawWave('npWave'));
      $('npTitle').textContent = sl.name;
      const left = Math.max(1, Math.round(sl.len * (1 - frac)));
      $('npLeft').textContent = left + (left === 1 ? ' minute remaining' : ' minutes remaining');
      const box = $('npScript');
      if (npLineIdx !== S.line || !box.firstChild) {
        box.querySelectorAll('.np-line').forEach((o) => { o.classList.add('out'); setTimeout(() => o.remove(), 500); });
        const el = document.createElement('span');
        el.className = 'np-line in';
        lines[S.line].words.forEach((w) => { const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w + ' '; el.appendChild(sp); });
        box.appendChild(el);
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('in')));
        npLineIdx = S.line;
      }
      const cur = box.querySelector('.np-line:not(.out)');
      if (cur) [...cur.children].forEach((w, j) => w.classList.toggle('on', j < S.word));
    }

    const steps = genSteps(), busy = S.gen >= 0;
    const ledH = $('ledHome');
    ledH.className = 'led' + (busy ? ' blink' : (S.playing ? ' live' : ''));
    $('stateHome').textContent = busy ? steps[S.gen] + '  ' + (S.gen + 1) + '/' + steps.length : (S.dirty ? 'Program changed, press Generate' : (S.playing ? 'On air' : ''));
    ledH.style.display = (busy || S.playing) ? '' : 'none';
    $('openPlayer').hidden = true;

    if (lines.length) {
      $('ledPlayer').className = 'led' + (S.playing ? ' live' : '');
      const c = lines[S.line].c, sp = showProgram.find((p) => p.id === c);
      const toneKey = liveCorner() + '|' + slotIdx;
      if (toneKey !== lastToneKey) { lastToneKey = toneKey; if (!drag) renderProgram(); }
      $('statePlayer').textContent = cornerName(c) + (sp ? '  ·  ' + sp.min + ' min' : '');
      const e = Math.floor(t);
      $('elapsed').textContent = pad(Math.floor(e / 60)) + ':' + pad(e % 60);
      lnEls.forEach((el, i) => { const k = i - S.line; el.className = 'ln' + (k === 0 ? ' active' : (Math.abs(k) > 2 ? ' far' : '')); });
      lines[S.line].wEls.forEach((w, j) => w.classList.toggle('on', j < S.word));
      const y = lnEls[S.line].offsetTop - lyrics.clientHeight * 0.3;
      col.style.transform = 'translateY(' + (-Math.max(-30, y)) + 'px)';
    }

    $('kGen').classList.toggle('busy', busy);
    $('kcArt').classList.toggle('loading', busy);
    { const kind = busy ? 'Generating  ' + (S.gen + 1) + '/' + steps.length : programKind();
      const name = busy ? steps[S.gen] : SLOTS[slotIdx].name;
      const nm = $('kcName');
      if ($('kcKind').textContent !== kind) $('kcKind').textContent = kind;
      if (nm.textContent !== name) { nm.textContent = name; nm.classList.remove('swap'); void nm.offsetWidth; nm.classList.add('swap'); } }
    $('pPlay').innerHTML = S.playing ? PAUSE_S : PLAY_S;
    $('pPlay').setAttribute('aria-label', S.playing ? 'Pause' : 'Play');
    Object.keys(SVC).forEach((k) => { const t = $('t-' + k); t.classList.toggle('on', SVC[k]); t.setAttribute('aria-pressed', String(SVC[k])); t.setAttribute('aria-label', t.dataset.name + (SVC[k] ? ', connected' : ', not connected')); });
    S.mail = SVC.gmail || SVC.outlook; S.ai = SVC.claude || SVC.openai;
    const apps = ['gmail', 'outlook', 'claude', 'openai'].filter((k) => SVC[k]).length;
    $('stApps').classList.toggle('on', apps > 0); $('stApps').textContent = apps ? 'Connected' : 'Not connected';
    $('stSpeaker').classList.toggle('on', SVC.speaker); $('stSpeaker').textContent = SVC.speaker ? 'Connected' : 'Not connected';
    document.querySelector('.spk-name').style.color = SVC.speaker ? '#E6E6E3' : '#6E6E6B';
    drawWave();
  }
  const PLAY = '<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12.2-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6z"/></svg>';
  const PLAY_S = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12.2-7.4a1 1 0 0 0 0-1.72L8.5 3.74A1 1 0 0 0 7 4.6z"/></svg>';
  const PAUSE_S = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.4"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.4"/></svg>';
  const PAUSE = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.6" height="16" rx="1.4"/><rect x="13.9" y="4" width="4.6" height="16" rx="1.4"/></svg>';

  let npLineIdx = -1;
  function genSteps(){
    return ['Reading calendar', (SVC.gmail || SVC.outlook) ? 'Ranking 16 emails' : 'Skipping email', (SVC.claude || SVC.openai) ? 'Reading AI chats' : 'Skipping AI chat', 'Writing ' + program.length + ' corners', 'Voicing Dave'];
  }
  function generate(){
    if (S.gen >= 0) return;
    if (synth && S.voice) { try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } catch(e){} }
    pause();
    S.view = 'home'; S.gen = 0; S.edit = false; renderProgram(); render();
    const n = genSteps().length;
    const step = () => {
      if (S.gen + 1 >= n) {
        autoNow = true;
        buildShow();
        S.gen = -1; S.hasEp = true; S.dirty = false; S.line = startLine(); S.word = 0; S.view = 'player';
        render(); setTimeout(play, 500); return;
      }
      S.gen++; render(); setTimeout(step, 650);
    };
    setTimeout(step, 650);
  }

  $('kGen').addEventListener('click', generate);
  $('pPlay').addEventListener('click', toggle);
  document.querySelectorAll('.tile').forEach((t) => {
    t.dataset.name = t.getAttribute('aria-label');
    t.addEventListener('click', () => { const k = t.dataset.svc; SVC[k] = !SVC[k]; if (S.hasEp) S.dirty = true; render(); toast(t.dataset.name + (SVC[k] ? ' connected' : ' disconnected')); });
  });
  $('openPlayer').addEventListener('click', () => { S.view = 'player'; render(); });
  $('back').addEventListener('click', () => { S.view = 'home'; render(); });
  $('npOpen').addEventListener('click', () => { S.view = 'player'; render(); });
  $('pgEdit').addEventListener('click', () => { S.edit = !S.edit; renderProgram(); });
  $('share').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText('My 30 minute show on OnGen'); toast('Episode link copied'); }
    catch(e){ toast('Sharing opens from the app on your phone'); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.view === 'player') { S.view = 'home'; render(); } });
  window.addEventListener('resize', () => { render(); drawDial(); });

  if (window.ResizeObserver) new ResizeObserver(() => layoutLegend(lgItems)).observe(legend);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layoutLegend(lgItems)).catch(() => {});
  buildShow();
  const h = location.hash.replace('#',''); let h_corner = '';
  if (h === 'player') { S.hasEp = true; S.line = 4; S.word = 6; S.view = 'player'; }
  const hc = h.split(':'); if (hc[0] === 'playing' && hc[1]) h_corner = hc[1];
  if (hc[0] === 'playing') { autoNow = true; buildShow(); h_corner = h_corner || START_CORNER; S.hasEp = true; S.playing = true; S.line = 4; S.word = 6; }
  if (h_corner) { const k = lines.findIndex((l) => l.c === h_corner); if (k >= 0) { S.line = k; S.word = 6; } }
  if (h === 'edit') S.edit = true;
  renderProgram();
  tickClock(); setInterval(tickClock, 1000);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawDial(); drawWave(); drawModes(); }).catch(() => {});
  render();
})();
</script>

</nav>
<script>
(function(){
  var root = document.documentElement, btn = document.getElementById('themeBtn'), meta = document.querySelector('meta[name="theme-color"]');
  function sync(){
    var light = root.getAttribute('data-theme') === 'light';
    btn.setAttribute('aria-label', light ? 'Switch to dark theme' : 'Switch to light theme');
    btn.title = light ? 'Dark theme' : 'Light theme';
    if (meta) meta.setAttribute('content', light && innerWidth > 500 ? '#F4F4F1' : '#0A0A0A');
  }
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ongen-theme', next); } catch (e) {}
    sync();
  });
  sync();
})();
</script>
