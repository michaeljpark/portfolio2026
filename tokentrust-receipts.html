<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TokenTrust — Receipt Ledger Motion</title>
<style>
  :root{
    --ink:#221c15;
    --paper:#f4efe3;
    --bg:#0e0d0b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}

  /* ---------- viewport letterbox + 1920x1080 stage ---------- */
  .frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .stage{
    position:relative;width:1920px;height:1080px;flex:none;
    background:var(--bg);
    overflow:hidden;
    transform-origin:center center;
  }
  .stage::after{ /* film vignette + subtle grain bands above everything */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:80;
    background:
      repeating-linear-gradient(0deg, rgba(20,16,10,.02) 0 3px, transparent 3px 7px),
      radial-gradient(130% 100% at 50% 50%, transparent 52%, rgba(22,17,10,.38) 100%);
  }

  /* ---------- full-bleed receipt slides ---------- */
  .slides{position:absolute;inset:0;z-index:1}
  .slide{position:absolute;inset:0;display:none;overflow:hidden}
  .bgfill{position:absolute;inset:-50px;pointer-events:none}
  .slide.active{display:block}

  /* entrance slam: 촤좌작 stepped jolt on every cut */
  .slide.active .slam{
    position:absolute;inset:0;
    animation:slam .16s steps(3,end) both;
  }
  @keyframes slam{
    0%  {transform:scale(1.12) translate(14px,-9px)}
    50% {transform:scale(1.045) translate(-6px,5px)}
    100%{transform:scale(1) translate(0,0)}
  }
  /* slow zoom drift while the slide holds (duration set per-cut in JS) */
  .slide.active .zoom{
    position:absolute;inset:0;
    animation:drift 1s linear both;
  }
  @keyframes drift{
    from{transform:scale(1)}
    to  {transform:scale(1.085)}
  }
  .pos{position:absolute;left:50%;top:50%}

  /* quick print-head sweep on each cut */
  .slide.active .sweep{
    position:absolute;left:0;width:100%;height:4px;z-index:6;pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(255,252,240,.9), transparent);
    box-shadow:0 0 22px 6px rgba(255,248,224,.35);
    animation:sweep .26s ease-out both;
  }
  @keyframes sweep{
    0%{top:-2%;opacity:.9} 80%{opacity:.6} 100%{top:102%;opacity:0}
  }

  /* ---------- receipt base (flat top, torn bottom) ---------- */
  .receipt{
    position:relative;
    width:var(--w,330px);
    background:
      repeating-linear-gradient(0deg, rgba(29,26,22,.028) 0 2px, transparent 2px 5px),
      linear-gradient(180deg, var(--p1,#f4efe3) 0%, var(--p2,#efe8d8) 100%);
    color:var(--rink,var(--ink));
    font-family:var(--ff,"Courier New"), ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:15.5px; line-height:1.42; font-weight:700;
    letter-spacing:.2px;
    padding:24px 22px 30px;
    clip-path:polygon(
      0 0, 100% 0,
      100% calc(100% - 7px), 97% 100%, 94% calc(100% - 7px), 91% 100%, 88% calc(100% - 7px),
      85% 100%, 82% calc(100% - 7px), 79% 100%, 76% calc(100% - 7px), 73% 100%,
      70% calc(100% - 7px), 67% 100%, 64% calc(100% - 7px), 61% 100%, 58% calc(100% - 7px),
      55% 100%, 52% calc(100% - 7px), 49% 100%, 46% calc(100% - 7px), 43% 100%,
      40% calc(100% - 7px), 37% 100%, 34% calc(100% - 7px), 31% 100%, 28% calc(100% - 7px),
      25% 100%, 22% calc(100% - 7px), 19% 100%, 16% calc(100% - 7px), 13% 100%,
      10% calc(100% - 7px), 7% 100%, 4% calc(100% - 7px), 1% 100%, 0 calc(100% - 7px)
    );
  }
  .receipt::after{
    content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
    background:
      repeating-linear-gradient(0deg, rgba(120,104,80,.05) 0 9px, transparent 9px 31px),
      linear-gradient(98deg, transparent 60%, rgba(110,96,72,.10) 78%, transparent 92%);
  }

  /* ---------- variants ---------- */
  .v-invoice{--p1:#fbf7ec;--p2:#f3edde;--ff:"Lucida Console";font-size:14px;letter-spacing:0;padding-top:0}
  .v-invoice .rc-topbar{margin:0 -22px 14px;height:12px;background:var(--ink)}
  .v-invoice .rc-h{text-align:left;font-size:19px;letter-spacing:1.5px}
  .v-invoice .rc-sub{text-align:left;letter-spacing:1px}
  .v-invoice .rule{border-top:2px solid rgba(29,26,22,.8)}
  .v-invoice .rule.thin{border-top:1px solid rgba(29,26,22,.45)}

  .v-band{padding-top:0}
  .v-band .rc-band{
    margin:0 -22px 12px;padding:10px 18px 8px;background:var(--ink);color:var(--p1,#f4efe3);
    text-align:center;font-size:19px;letter-spacing:4px;
  }
  .v-band .rc-band small{display:block;font-size:11px;letter-spacing:2px;opacity:.75}
  .v-band .rule{border-top:3px double rgba(29,26,22,.7);margin:9px 0}

  .v-aged{--p1:#efe3c6;--p2:#e7d7b2;--rink:#3c2f1b;font-size:15px}
  .v-aged .rule{border-top:2px dashed rgba(60,47,27,.6)}
  .v-aged .rc-h{letter-spacing:5px}
  .v-aged::after{
    background:
      repeating-linear-gradient(0deg, rgba(120,90,40,.08) 0 7px, transparent 7px 26px),
      linear-gradient(115deg, rgba(120,90,40,.14) 4%, transparent 30%, rgba(120,90,40,.12) 88%);
  }

  .v-tape{--p1:#f6f2e8;--p2:#efe9da;font-size:12px;padding:14px 12px 22px}
  .v-tape .rc-sub{font-size:11px}

  .v-card{--p1:#f1ece0;--p2:#e9e2cf;font-size:14.5px}
  .v-card .rc-inner{border:2px solid rgba(29,26,22,.75);padding:12px 12px 8px;margin:-6px -6px 0}
  .v-card .rc-h{font-size:18px}

  /* ---------- line styles ---------- */
  .rc-h{font-size:21px;letter-spacing:3px;text-align:center;margin-bottom:2px}
  .rc-sub{font-size:12.5px;letter-spacing:2px;text-align:center;opacity:.72;font-weight:700}
  .rc-c{text-align:center}
  .rule{border:none;border-top:2px dashed rgba(29,26,22,.55);margin:10px 0}
  .rule.thin{border-top:1px dashed rgba(29,26,22,.4);margin:7px 0}
  .kv{display:flex;justify-content:space-between;gap:12px;white-space:nowrap}
  .kv .dots{flex:1;overflow:hidden;opacity:.45;font-weight:400}
  .kv .dots::before{content:"··········································"}
  .sm{font-size:13px}
  .xs{font-size:11.5px;letter-spacing:1px}
  .big{font-size:18px}
  .stamp-ok{
    display:inline-block;border:3px solid currentColor;padding:2px 12px;
    letter-spacing:4px;transform:rotate(-5deg);font-size:15px;border-radius:3px;opacity:.85;
  }
  .faded{
    -webkit-mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.25) 32%,#000 55%,rgba(0,0,0,.45) 80%,#000 100%);
            mask-image:linear-gradient(90deg,#000 0%,rgba(0,0,0,.25) 32%,#000 55%,rgba(0,0,0,.45) 80%,#000 100%);
  }
  .faded2{
    -webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.5) 0%,#000 28%,rgba(0,0,0,.2) 60%,#000 100%);
            mask-image:linear-gradient(90deg,rgba(0,0,0,.5) 0%,#000 28%,rgba(0,0,0,.2) 60%,#000 100%);
  }
  .ghost{text-shadow:1.4px .4px 0 rgba(29,26,22,.30)}
  .blurline{filter:blur(.45px);opacity:.88}
  .smear{filter:blur(.3px);text-shadow:0 1.6px 2px rgba(29,26,22,.4)}
  .barcode{
    height:46px;margin:10px auto 2px;width:86%;
    background:repeating-linear-gradient(90deg,
      currentColor 0 2px, transparent 2px 4px,
      currentColor 4px 9px, transparent 9px 11px,
      currentColor 11px 12px, transparent 12px 16px,
      currentColor 16px 19px, transparent 19px 21px,
      currentColor 21px 22px, transparent 22px 27px);
    opacity:.9;
  }
  .barcode.smudged{filter:blur(.6px)}
  .qr{margin:10px auto 4px;position:relative}
  .qr i{position:absolute;background:currentColor}
  .holes{display:flex;justify-content:space-between;margin:6px 4px}
  .holes i{width:9px;height:9px;border-radius:50%;background:rgba(20,16,10,.85);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}

  /* ---------- ink-soaked logo, always on top ---------- */
  .press{ /* slightly pressed/bleached paper area so the stamp reads on any crop */
    position:absolute;z-index:48;left:50%;top:50%;
    width:1150px;height:420px;transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgba(246,241,229,.78), rgba(246,241,229,.34) 58%, transparent 75%);
    filter:blur(14px);
    pointer-events:none;
  }
  .logoWrap{
    position:absolute;z-index:50;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:880px;
    mix-blend-mode:multiply;          /* ink absorbed into the paper */
    pointer-events:none;
  }
  .logoWrap svg{width:100%;height:auto;display:block;color:var(--ink);filter:url(#inkbleed)}
  .logoMark{
    transform-origin:622.3px 47.8px;
    animation:spinMark 7s linear infinite;
  }
  @keyframes spinMark{to{transform:rotate(360deg)}}

  /* ---------- controls ---------- */
  .ui{position:fixed;right:18px;bottom:16px;z-index:100;display:flex;gap:10px}
  .ui button{
    background:rgba(24,20,14,.55);color:#e8e2d2;border:1px solid rgba(244,239,227,.3);
    font:700 12px/1 ui-monospace,monospace;letter-spacing:2px;
    padding:10px 16px;border-radius:4px;cursor:pointer;
  }
  .ui button:hover{background:rgba(24,20,14,.8)}
  .ui button:focus-visible{outline:2px solid #f4efe3;outline-offset:2px}

  @media (prefers-reduced-motion: reduce){
    .slide.active .slam,.slide.active .zoom{animation:none !important}
    .slide.active .sweep{display:none}
    .logoMark{animation:none !important}
  }
</style>
</head>

        <feDisplacementMap in="SourceGraphic" in2="fiber" scale="6" result="rough">
          <animate attributeName="scale" values="46;6" dur="2.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>

/* ============ render slides ============ */
let qrSeed = 7;
function qrHTML(){
  let s = (qrSeed += 13), cells = '';
  const rnd = ()=> (s = (s*9301+49297)%233280) / 233280;
  for(let y=0;y<11;y++) for(let x=0;x<11;x++){
    const corner = (x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7);
    if(corner ? !((x%2)&&(y%2)) : rnd()>.52)
      cells += `<i style="left:${x*7}px;top:${y*7}px;width:7px;height:7px"></i>`;
  }
  return `<div class="qr" style="width:77px;height:77px">${cells}</div>`;
}
function lineHTML(L){
  switch(L.t){
    case 'h':    return `<div class="rc-h">${L.v}</div>`;
    case 'sub':  return `<div class="rc-sub">${L.v}</div>`;
    case 'c':    return `<div class="rc-c ${L.cls||''}">${L.v}</div>`;
    case 'kv':   return `<div class="kv ${L.cls||''}"><span>${L.k}</span><span class="dots"></span><span>${L.v}</span></div>`;
    case 'rule': return `<hr class="rule">`;
    case 'thin': return `<hr class="rule thin">`;
    case 'bar':  return `<div class="barcode ${L.s||''}"></div>`;
    case 'holes':return `<div class="holes"><i></i><i></i><i></i><i></i><i></i><i></i></div>`;
    case 'stamp':return `<div class="rc-c" style="margin:8px 0 4px"><span class="stamp-ok">${L.v}</span></div>`;
    case 'topbar':return `<div class="rc-topbar"></div>`;
    case 'band': return `<div class="rc-band">${L.v}<small>${L.s||''}</small></div>`;
    case 'qr':   return qrHTML();
  }
  return '';
}

const slidesEl = document.getElementById('slides');
receipts.forEach((rc)=>{
  const K = (2300 / rc.w).toFixed(3);          // fill 1920 with bleed
  const paper = {'':'#f0ebdd','v-invoice':'#f7f2e4','v-band':'#f0ebdd','v-aged':'#eadcba','v-tape':'#f2eddf','v-card':'#ece6d6'}[rc.v||''];
  const body = rc.lines.map(lineHTML).join('');
  const slide = document.createElement('div');
  slide.className = 'slide';
  slide.style.filter = `url(#${rc.smudge})`;

  slide.innerHTML = `
    <div class="bgfill" style="background:${paper}"></div>
    <div class="slam"><div class="zoom">
      <div class="pos" style="transform:translate(-50%,-50%) rotate(${rc.rot}deg) scale(${K}) translate(0px,${rc.oy}px)">
        <div class="receipt ${rc.v||''}" style="--w:${rc.w}px">
          ${rc.inner ? `<div class="rc-inner">${body}</div>` : body}
        </div>
      </div>
    </div></div>
    <div class="sweep"></div>`;
  slidesEl.appendChild(slide);
});
const slides = [...slidesEl.children];

/* ============ rapid-cut driver (촤좌작), infinite ============ */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let idx = 0, timer = null, playing = true;

function show(i, holdMs){
  slides.forEach((s,j)=>s.classList.toggle('active', j===i));
  const z = slides[i].querySelector('.zoom');
  z.style.animationDuration = (holdMs + 240) + 'ms';   // drift spans the hold
}
function next(){
  if(!playing) return;
  /* rhythm: bursts of 3-4 quick cuts, then one longer beat */
  const beat = (idx % 4 === 3);
  const hold = beat ? 1250 + Math.random()*350
                    : 480  + Math.random()*260;
  show(idx, hold);
  idx = (idx + 1) % slides.length;
  timer = setTimeout(next, hold);
}
if (reduced){ show(0, 999999); }
else next();

/* ============ fit 1920x1080 ============ */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  document.getElementById('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ============ pause / play ============ */
const btn = document.getElementById('pause');
btn.addEventListener('click', ()=>{
  playing = !playing;
  btn.textContent = playing ? '⏸ PAUSE' : '▶ PLAY';
  document.querySelectorAll('.stage *').forEach(el=>{
    el.style.animationPlayState = playing ? 'running' : 'paused';
  });
  if (!playing) clearTimeout(timer);
  else next();
});
</script>
